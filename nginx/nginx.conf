# ============================================================
# Nginx 설정 — Claude Review Server
# 수정 필요: server_name 을 실제 도메인으로 변경
# ============================================================

server_tokens off;

# ── HTTP → HTTPS 리다이렉트 ────────────────────────────────────────────────
server {
    listen      80;
    server_name review.yourdomain.com;   # ← 실제 도메인으로 변경

    # Let's Encrypt ACME 챌린지 (인증서 발급용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 본서버 ───────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    http2       on;
    server_name review.yourdomain.com;   # ← 실제 도메인으로 변경

    # ── SSL 인증서 (Let's Encrypt) ─────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/review.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.yourdomain.com/privkey.pem;

    # ── SSL 보안 설정 ──────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── 보안 헤더 ──────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "DENY"          always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer"   always;

    # ── 요청 크기 제한 ────────────────────────────────────────────────────
    client_max_body_size 512k;

    # ── /health — 업타임 체크용 (인증 없음) ──────────────────────────────
    location = /health {
        proxy_pass         http://review-server:3000/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log         off;
    }

    # ── /review — 코드리뷰 엔드포인트 (POST 전용) ────────────────────────
    location = /review {
        # POST 이외 메서드 전부 차단
        limit_except POST {
            deny all;
        }

        proxy_pass          http://review-server:3000/review;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Claude API 응답 대기 (최대 90초)
        proxy_read_timeout  90s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 10s;
    }

    # ── 그 외 모든 경로 완전 차단 ─────────────────────────────────────────
    # 정보 노출 없이 조용히 연결 종료
    location / {
        return 444;   # Nginx 전용: 응답 없이 연결 종료
    }
}
