entries:
  - date: "2026-04-23"
    slug: "thinking-question"
    title: "리뷰가 질문을 던지다 — 생각해보기"
    description: "AI 리뷰가 '생각해보기' 질문을 자동으로 생성합니다. 리뷰를 읽고 끝나는 것이 아니라, 한 가지 질문을 더 고민하게 되어 학습 효과가 높아집니다. 궁금한 점은 @sparta 멘션으로 바로 질문할 수 있습니다."
    detail: |-
      **왜 이런 업데이트를 했을까요?**

      32건의 리뷰 데이터를 분석해보니, 수강생들은 AI 리뷰를 잘 읽고 있었지만 리뷰를 넘어선 상호작용이 전혀 없었습니다. 반박 기능, @sparta 질문, 하단 버튼 — 모든 부가 기능의 사용률이 0%였습니다.

      원인을 분석해보니 "리뷰가 충분히 좋아서 질문이 안 생긴다"는 것과 "질문 방법을 모른다"는 두 가지였습니다. 수강생은 리뷰를 읽고 수정하고 다시 PR을 올리는 루프에 이미 만족하고 있었습니다.

      **그래서 접근 방식을 바꿨습니다.**

      수강생이 직접 질문을 만들어서 물어보기를 기대하는 대신, **AI가 먼저 질문을 던지기로** 했습니다. "이 동시성 제어 방식은 트래픽이 10배 늘어나면 어떤 문제가 발생할까요?" 같은 질문이 리뷰 끝에 자동으로 생성됩니다.

      코드를 보면 답이 바로 보이는 질문이 아니라, 원리와 트레이드오프를 고민해야 하는 질문입니다. 수강생은 이 질문을 읽는 순간 자연스럽게 머릿속에서 답을 떠올리게 되고, 이것이 실제 학습으로 이어집니다.

      **무엇이 바뀌었나요?**

      - **"생각해보기" 섹션 추가**: 리뷰의 학습 포인트 뒤에 질문 1개가 자동 생성됩니다. 멘토 페르소나는 학습적인 질문, 시니컬 페르소나는 운영 환경에서의 실패 시나리오를 묻는 도전적인 질문을 던집니다.
      - **@sparta 멘션 유도 단순화**: 기존 shields.io 뱃지 3개를 제거하고, 생각해보기 질문 아래에 "궁금하면 @sparta를 남겨보세요"라는 자연스러운 안내 문구로 교체했습니다.
      - **API 비용 정확도 개선**: 카탈로그에 등록되지 않은 AI 모델에도 기본 단가가 적용되어, 비용 통계가 "비용 미확인"이 아닌 실제 추정치로 표시됩니다.
    detail: "full"
    category: "feature"
    action: "상세보기 →"
    action-url: "/release/thinking-question"
  - date: "2026-04-20"
    slug: "tunnel-infra-standardization"
    title: "서버 이중화 안정화 및 인프라 표준화"
    description: "Active/Standby 서버 간의 네트워크 환경을 Docker로 표준화하여 라우팅 충돌 및 502 에러를 해결했습니다."
    detail: |-
      **이중화의 맹점을 해결했습니다:**
      홈서버(Active)와 개발PC(Standby)가 같은 터널을 공유할 때 발생하던 라우팅 충돌을 해결했습니다. 대기서버의 인프라를 홈서버와 동일한 Docker 기반으로 표준화하여 장애 조치(Failover)의 신뢰성을 높였습니다.

      **수정 내용:**
      - **인프라 표준화**: 대기서버의 cloudflared를 Docker 컨테이너로 전환하여 홈서버와 동일한 네트워크 환경 제공
      - **라우팅 충돌 해결**: Docker 브리지 네트워크를 통한 내부 서비스명(review-server, grafana) 해석 지원
      - **환경 변수 보완**: Grafana 관리자 비밀번호 등 필수 변수 누락으로 인한 컨테이너 실행 실패 수정
      - **구성 자동화**: `docker-compose.standby.yml` 확장 및 설정 파일 구조화
    category: "fix"
    action: "장애 대응 기록 보기 →"
    action-url: "/incident"
  - date: "2026-04-20"
    slug: "monitoring-phase1"
    title: "서버 로그 모니터링 시스템"
    description: "이상징후를 자동 탐지하여 Slack으로 알림을 보내고, 팀별·모델별 사용 패턴을 Prometheus 메트릭으로 수집합니다. Claude API가 연속 실패하면 헬스체크에 반영됩니다."
    detail: "MonitorService가 1분 간격으로 인증 차단·리뷰 실패·Rate Limit 급증을 감지합니다. 임계치 초과 시 Slack 알림이 발송되며, 쿨다운으로 중복 알림을 방지합니다. 헬스체크는 API에 직접 요청하지 않고 마지막 성공 시간과 연속 실패 횟수만으로 판단하여 비용을 절약합니다."
    category: "feature"
    action: "시나리오 보기 →"
    action-url: "/release/monitoring-phase1"
  - date: "2026-04-20"
    slug: "cli-proxy-hotfix"
    title: "CLI 폴백 복구 — Docker→Host 통신 수정"
    description: "Claude API 장애 시 Gemini CLI로 폴백하는 기능이 프로덕션에서 동작하지 않았던 문제를 수정했습니다. 원인은 Docker 네트워크 설정 누락이었습니다."
    detail: |-
      **비상구가 잠겨있었습니다:**
      Claude API 장애 시 보조 AI(Gemini)가 대신 답변하도록 설계했지만, 컨테이너에서 호스트로 가는 통로가 설정되지 않아 실제로는 동작하지 않았습니다.

      **수정 내용:**
      - 컨테이너→호스트 통로 설정 추가
      - 보조 서버가 모든 연결을 수용하도록 변경
      - 2초 연결 타임아웃 + 과열 방지 장치로 불필요한 대기 시간 제거
      - 배포 후 7단계 자동 검증 스크립트로 재발 방지
    category: "fix"
