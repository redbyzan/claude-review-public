id: "arch-001"
category: "architecture"
input:
  diff: |
    diff --git a/src/main/java/com/example/ticket_javara/domain/booking/service/BookingConfirmService.java b/src/main/java/com/example/ticket_javara/domain/booking/service/BookingConfirmService.java
    new file mode 100644
    --- /dev/null
    +++ b/src/main/java/com/example/ticket_javara/domain/booking/service/BookingConfirmService.java
    @@ -0,0 +1,30 @@
    +package com.example.ticket_javara.domain.booking.service;
    +
    +import org.springframework.stereotype.Service;
    +import org.springframework.transaction.annotation.Transactional;
    +import lombok.RequiredArgsConstructor;
    +import lombok.extern.slf4j.Slf4j;
    +
    +/**
    + * 예매 확정 전용 서비스 (트랜잭션 담당)
    + *
    + * [분리 이유]
    + * WebhookService.confirmOrder()가 같은 클래스 내부 호출이면
    + * Spring AOP 프록시를 우회하여 @Transactional이 작동하지 않는다.
    + * 별도 Bean으로 분리하여 프록시를 통한 트랜잭션 보장
    + */
    +@Slf4j
    +@Service
    +@RequiredArgsConstructor
    +public class BookingConfirmService {
    +
    +    private final OrderRepository orderRepository;
    +    private final BookingRepository bookingRepository;
    +
    +    @Transactional
    +    public WebhookResponseDto confirmOrder(Order order, List<Booking> bookings) {
    +        order.confirm();
    +        bookings.forEach(b -> b.confirm(generateTicketCode(b)));
    +        return WebhookResponseDto.success();
    +    }
    +}
  pr_title: "refactor: confirmOrder() logic to separate BookingConfirmService"
  pr_author: "jiiimni"
  repo: "6team-Plus-project-sparta/Ticket_JAVARA"
  persona: "mentor"
expected:
  must_contain:
    - "트랜잭션"
    - "AOP"
    - "프록시"
    - "분리"
  severity: "info"
source:
  type: "real"
