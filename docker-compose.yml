services:

  # ── Nginx (리버스 프록시 + SSL 종단) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: review-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      review-server:
        condition: service_healthy
    networks:
      - review-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node.js 리뷰 서버 ───────────────────────────────────────────────────
  review-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: review-server
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"          # 외부 직접 노출 없음 — Nginx 경유만
    networks:
      - review-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Certbot (SSL 인증서 발급 / 갱신) ────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: review-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - review-net
    profiles:
      - certbot          # 평소엔 실행 안 됨. 명시적으로만 실행

volumes:
  certbot-webroot:

networks:
  review-net:
    driver: bridge
